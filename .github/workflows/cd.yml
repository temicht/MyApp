name: CD Deploy to Server

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        script: |
          cd /home/temich/deploy/is-stack
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u temicht --password-stdin
          docker compose pull
          docker compose up -d
          docker image prune -f
